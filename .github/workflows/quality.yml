name: Quality

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-beam-${{ hashFiles('.tool-versions', 'mix.lock') }}
      - name: Run every quality gate
        run: |
          python3 - <<'PYTHON'
          import json
          import subprocess
          for gate in json.load(open(".hone-gates.json"))["gates"]:
              print(f"::group::{gate['name']}", flush=True)
              subprocess.run(gate["command"], shell=True, check=True, timeout=gate.get("timeout", 600))
              print("::endgroup::", flush=True)
          PYTHON
      - uses: actions/upload-artifact@v7
        with:
          name: hex-package
          path: otp_form_assistant-*.tar
      - name: Build the published documentation
        if: github.ref == 'refs/heads/main'
        env:
          MIX_ENV: dev
          DOCS_SOURCE_REF: ${{ github.sha }}
        run: mix docs --warnings-as-errors
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - name: Upload the documentation site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: doc

  documentation:
    if: github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the documentation
        id: deployment
        uses: actions/deploy-pages@v5
